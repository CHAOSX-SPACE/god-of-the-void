id = "csharp"
nombre = "C#"

[ficha]
en = "C#: `dotnet format` · `dotnet build` · `dotnet test`. `async` all the way (no `.Result`/`.Wait()`); `using` for disposables; nullable enabled and respected."
es = "C#: `dotnet format` · `dotnet build` · `dotnet test`. `async` hasta arriba (nada de `.Result`/`.Wait()`); `using` para lo que se libera; nulabilidad habilitada y respetada."

[ley9]
en = "C#: `CultureInfo.InvariantCulture.CompareInfo.IndexOf(text, wanted, CompareOptions.IgnoreCase | CompareOptions.IgnoreNonSpace) >= 0`."
es = "C#: `CultureInfo.InvariantCulture.CompareInfo.IndexOf(texto, buscado, CompareOptions.IgnoreCase | CompareOptions.IgnoreNonSpace) >= 0`."

[detectar]
extensiones = ["csproj", "cs", "sln"]
palabras = [" c# ", " csharp", " dotnet", ".net"]

[[gestores]]
nombre = "dotnet"
por_omision = true
[gestores.tareas]
instalar = "dotnet restore"
compilar = "dotnet build"
revisar = "dotnet build -warnaserror"
formatear = "dotnet format"
probar = "dotnet test"
una_prueba = "dotnet test --filter FullyQualifiedName~{nombre}"

[no_interactivo]
variables = { DOTNET_CLI_TELEMETRY_OPTOUT = "1", DOTNET_NOLOGO = "1" }

[vivos]
patrones = ["dotnet watch"]

[errores]
archivo_linea = ['(?P<archivo>[^\s(]+\.cs)\((?P<linea>\d+),\d+\)', 'in (?P<archivo>\S+\.cs):line (?P<linea>\d+)']
